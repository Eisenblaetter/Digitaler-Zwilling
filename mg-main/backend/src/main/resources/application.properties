server.servlet.context-path=${CONTEXT_PATH:/umlp/api}
server.port=${PORT:8081}
umlp.service.websocket.impl=noAuth

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

#spring.sql.init.mode=always
# No caching in browser during dev, otherwise old versions are displayed
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# MQTT Configuration
mqtt.broker.url=tcp://127.0.0.1:1883
mqtt.client.id=digitaltwin-monitoring
mqtt.topics=PLC/#
mqtt.reconnect.enabled=true
mqtt.reconnect.interval=5000
